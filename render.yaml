# Render Blueprint for a free demo deployment (not production: see docs/DEPLOY.md).
# The free web service sleeps after 15 minutes without traffic, its disk is ephemeral
# (uploaded photos disappear on restart) and the free database expires after 30 days.
services:
  - type: web
    name: beauty-stories-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: beauty-stories-demo-db
          property: connectionString
      - key: PORT
        value: "8080"
      - key: PUBLIC_URL
        sync: false
      - key: NOINDEX
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"

databases:
  - name: beauty-stories-demo-db
    plan: free
    postgresMajorVersion: "17"
    databaseName: shop
    user: shop
